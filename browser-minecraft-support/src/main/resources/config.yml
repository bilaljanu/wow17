# BrowserMinecraftSupport — configuration
# -----------------------------------------

# ─── Main switch ──────────────────────────────────────────────────────────────
enabled: true

# ─── Compatibility ────────────────────────────────────────────────────────────
compatibility:
  # Send broadcast messages when a browser client joins.
  announce-joins: false

  # Prepend "[Browser] " to chat messages from browser clients.
  prefix-chat: true

# ─── Security ─────────────────────────────────────────────────────────────────
security:
  # Maximum concurrent browser-client sessions.  0 = unlimited.
  max-sessions: 20

# ─── Diagnostics ──────────────────────────────────────────────────────────────
debug:
  log-plugin-messages: false