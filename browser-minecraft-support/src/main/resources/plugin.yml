name: BrowserMinecraftSupport
main: io.browserminecraft.BrowserMinecraftSupport
version: 1.0.0
api-version: 1.21
author: BrowserMinecraft Project
description: Companion plugin providing browser-client compatibility for Purpur 1.21.1

commands:
  bmcs:
    description: BrowserMinecraftSupport administrative commands
    usage: /bmcs <status|reload|version|list>
    aliases: [browserclient]
    permission: browserclient.admin

permissions:
  browserclient.admin:
    description: Allows access to /bmcs admin commands
    default: op
  browserclient.supported:
    description: Marks a player as allowed to connect via browser client path
    default: true